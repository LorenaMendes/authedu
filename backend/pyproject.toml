[project]
name = "authedu-api"
version = "0.1.0"
description = "Educational authentication and authorization reference API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv-build==0.13.6"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
]

[tool.uv]
required-version = "==0.13.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
