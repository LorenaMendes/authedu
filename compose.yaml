services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the untracked .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the untracked .env file}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - authedu-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the untracked .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the untracked .env file}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      AUTHEDU_CSRF_SECRET_FILE: /run/secrets/csrf_signing_key
      AUTHEDU_PUBLIC_ORIGIN: ${AUTHEDU_PUBLIC_ORIGIN:-https://localhost:5173}
      AUTHEDU_DEMO_MODE: ${AUTHEDU_DEMO_MODE:-}
      AUTHEDU_DEMO_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in the untracked .env file}
    secrets:
      - postgres_password
      - csrf_signing_key
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      AUTHEDU_DEV_HOST: 0.0.0.0
      AUTHEDU_DEV_HTTPS: "1"
      AUTHEDU_DEV_TLS_CERT: /certs/localhost.pem
      AUTHEDU_DEV_TLS_KEY: /certs/localhost-key.pem
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - ./.certs:/certs:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  authedu-postgres-data:
  frontend-node-modules:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  csrf_signing_key:
    file: ./.secrets/csrf_signing_key
