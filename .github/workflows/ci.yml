name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install pinned Python and locked dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Unit and disposable PostgreSQL integration tests
        run: uv run --locked pytest --tb=short
      - name: Export locked dependencies for auditing
        run: |
          uv export --locked --all-groups --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/authedu-requirements.txt"
          test -s "$RUNNER_TEMP/authedu-requirements.txt"
      - name: Audit Python dependencies
        run: >-
          uv run --locked pip-audit --strict --disable-pip --no-deps --require-hashes
          --requirement "$RUNNER_TEMP/authedu-requirements.txt"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - name: Install pinned npm and locked dependencies
        run: |
          npm install --global npm@12.2.1
          npm ci
      - name: Lint
        run: npm run lint
      - name: Component and configuration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

  repository:
    name: Repository security and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history for secret scanning
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        # actionlint 1.7.12; Docker also provides ShellCheck for run steps.
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: Scan tracked Git history for secrets
        # Gitleaks 8.30.1; never print matching secret values or upload reports.
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact=100 --no-banner --log-opts="--all"